# Example custom rules for email-forensics (--rules examples/rules/example.toml).
# Conditions: { field = ..., <operator> = ... } with operators equals, contains, matches (regex),
# in (list), startswith, endswith, exists, gt/gte/lt/lte; or { finding = "CODE" } /
# { finding_prefix = "ATT_", min_severity = "medium" }. Fields include subject, from_domain,
# reply_to_domain, recipient_domains, body, url_host, attachment_ext, attachment_type,
# header:<Name>, auth:<method>, score, verdict and findings.

[[rule]]
id = "PAYMENT_CHANGE_REQUEST"
description = "Payment or bank-detail change request with a reply-to mismatch (BEC)"
severity = "high"
all = [
  { field = "body", matches = "(?i)(new|updated|change[ds]?).{0,40}(bank|account|iban|routing|payment) details" },
  { finding = "HDR_REPLY_TO_MISMATCH" },
]

[[rule]]
id = "EXECUTIVE_NAME_FROM_FREEMAIL"
description = "Executive's name in the display name, sent from a free-mail address"
severity = "high"
all = [
  { field = "from_display_name", matches = "(?i)\\b(jane doe|john smith)\\b" },
  { field = "from_domain", in = ["gmail.com", "outlook.com", "hotmail.com", "yahoo.com", "icloud.com"] },
]

[[rule]]
id = "PARTNER_NEWSLETTER"
description = "Known partner newsletter: its tracking links are expected"
action = "suppress"
suppress = ["URL_TEXT_MISMATCH", "HTML_TRACKING_PIXEL", "HTML_REMOTE_RESOURCES"]
all = [
  { field = "from_domain", equals = "news.partner.example" },
  { field = "auth:dmarc", equals = "pass" },
]
