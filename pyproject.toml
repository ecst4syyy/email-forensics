[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-forensics"
version = "1.1.1"
description = "Forensic analysis of email headers, bodies and attachments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dns = ["dnspython>=2.3"]
yara = ["yara-python>=4.3"]
all = ["dnspython>=2.3", "yara-python>=4.3"]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
email-forensics = "email_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_forensics = ["data/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
