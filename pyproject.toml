[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-forensics"
version = "1.1.1"
description = "Check whether an email is phishing or malware, with an explainable risk score and a local web app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["email", "forensics", "phishing", "malware", "dfir", "dkim", "spf", "dmarc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Communications :: Email",
    "Intended Audience :: Information Technology",
]

[project.urls]
Homepage = "https://github.com/ecst4syyy/email-forensics"
Documentation = "https://github.com/ecst4syyy/email-forensics/blob/HEAD/docs/GUIDE.md"
Changelog = "https://github.com/ecst4syyy/email-forensics/blob/HEAD/docs/CHANGELOG.md"

[project.optional-dependencies]
dns = ["dnspython>=2.3"]
yara = ["yara-python>=4.3"]
all = ["dnspython>=2.3", "yara-python>=4.3"]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
email-forensics = "email_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
email_forensics = ["data/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
