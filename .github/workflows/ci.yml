name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core has no dependencies; dev adds pytest and pyflakes)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes src tests scripts
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          email-forensics --version
          email-forensics analyze tests/fixtures/phish_html.eml --format jsonl > /dev/null
          email-forensics analyze tests/fixtures/legit.eml --fail-on suspicious --summary

  extras:
    # Optional integrations and the reference implementations used by cross-check tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all,dev]" hypothesis olefile
      - run: python -m pytest -q
      - name: Short fuzz campaign
        run: python scripts/fuzz.py --iterations 2000 --seed 1
