name: Release

# Builds the installable package (wheel + source) and publishes it as a GitHub Release.
# Run it from the Actions tab ("Run workflow"), or push a tag such as v1.2.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
          ls -l dist
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/email-forensics --version
          /tmp/check/bin/email-forensics analyze tests/fixtures/phish_html.eml --summary
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          wheel=$(basename dist/*.whl)
          notes="Install:

          \`\`\`
          pip install https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$wheel
          email-forensics serve
          \`\`\`

          Then open http://127.0.0.1:8025. Changes: see docs/CHANGELOG.md."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Email Forensics $version" --notes "$notes" --target "$GITHUB_SHA"
          fi
